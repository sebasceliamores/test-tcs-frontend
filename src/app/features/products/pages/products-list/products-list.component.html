<section class="page">
  <div class="panel">
    <div class="toolbar">
      <search-input (onChangeSearch)="onSearch($event)"></search-input>
      <app-button variant="primary" type="button" (clicked)="onAdd()">
        Agregar
      </app-button>
    </div>

    <section class="table-container">
      <product-table
        [productList]="productsView().products"
        [errorMessage]="productsView().error"
        (deleteRequested)="onDelete($event)"
      ></product-table>

      <div class="table-footer">
        <span class="result-count" data-testid="result-count">
          {{ productsView().shown }} Resultados
        </span>
        <select-page-size (onChangePageSize)="onPageSizeChange($event)"></select-page-size>
      </div>
    </section>

  </div>
</section>
